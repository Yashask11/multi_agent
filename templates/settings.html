<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus AI | Settings</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
    <style>
        .settings-container {
            max-width: 600px;
            margin: 4rem auto;
            padding: 0 2rem;
            color: #fff;
        }
        .settings-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 2.5rem;
            backdrop-filter: blur(10px);
        }
        .form-group {
            margin-bottom: 1.5rem;
        }
        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
        }
        .form-control {
            width: 100%;
            padding: 0.75rem;
            background: rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 8px;
            color: #fff;
            font-family: 'Inter', sans-serif;
        }
        .form-control:focus {
            outline: none;
            border-color: var(--accent-1);
        }
        .btn-save {
            background: var(--gradient-primary);
            color: #fff;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-save:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(221, 36, 118, 0.4);
        }
        .toast {
            display: none;
            background: #22c55e;
            color: white;
            padding: 0.75rem;
            border-radius: 8px;
            margin-bottom: 1rem;
            text-align: center;
        }
    </style>
</head>
<body class="landing-body">
    <div class="mesh-bg">
        <div class="mesh-blob blob-1"></div>
        <div class="mesh-blob blob-2"></div>
        <div class="mesh-blob blob-3"></div>
    </div>

    <nav class="landing-nav">
        <a href="/" class="logo" style="text-decoration: none;">
            <span class="logo-text">Nexus AI</span>
        </a>
        <div style="display: flex; gap: 1.5rem; align-items: center;">
            <a href="/app" class="nav-link">Workspace</a>
            <a href="/dashboard" class="nav-link">Dashboard</a>
            <a href="/logout" class="nav-link" style="color: #ef4444;">Logout</a>
        </div>
    </nav>

    <div class="settings-container">
        <h2 style="font-size: 2.5rem; font-weight: 800; margin-bottom: 2rem;">Settings</h2>
        
        <div class="settings-card">
            <div id="toast" class="toast">Settings saved successfully!</div>
            <form id="settingsForm">
                <div class="form-group">
                    <label for="model">Preferred LLM Model</label>
                    <select id="model" class="form-control">
                        <option value="llama-3.3-70b-versatile" {% if current_user.preferred_model == 'llama-3.3-70b-versatile' %}selected{% endif %}>Llama 3.3 70B (Fast, Balanced)</option>
                        <option value="mixtral-8x7b-32768" {% if current_user.preferred_model == 'mixtral-8x7b-32768' %}selected{% endif %}>Mixtral 8x7B (Great for Code)</option>
                        <option value="gemma2-9b-it" {% if current_user.preferred_model == 'gemma2-9b-it' %}selected{% endif %}>Gemma 2 9B (Lightweight)</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="temperature">Creativity (Temperature: <span id="tempVal">{{ current_user.temperature }}</span>)</label>
                    <input type="range" id="temperature" class="form-control" min="0.0" max="1.0" step="0.1" value="{{ current_user.temperature }}" oninput="document.getElementById('tempVal').innerText=this.value">
                    <small style="color: var(--text-muted); display: block; margin-top: 0.5rem;">Lower values are more factual, higher values are more creative.</small>
                </div>

                <button type="submit" class="btn-save">Save Settings</button>
            </form>
        </div>
    </div>

    <script>
        document.getElementById("settingsForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            const btn = e.target.querySelector("button");
            btn.textContent = "Saving...";
            
            const res = await fetch("/settings", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    model: document.getElementById("model").value,
                    temperature: document.getElementById("temperature").value
                })
            });
            
            if (res.ok) {
                const toast = document.getElementById("toast");
                toast.style.display = "block";
                setTimeout(() => toast.style.display = "none", 3000);
            }
            btn.textContent = "Save Settings";
        });
    </script>
</body>
</html>
