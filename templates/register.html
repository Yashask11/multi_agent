<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus AI | Sign Up</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
    <style>
        .auth-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }
        .auth-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 3rem;
            width: 100%;
            max-width: 400px;
            backdrop-filter: blur(20px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            text-align: center;
        }
        .auth-title {
            font-size: 2rem;
            font-weight: 800;
            margin-bottom: 0.5rem;
            background: var(--gradient-success);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .auth-subtitle {
            color: var(--text-secondary);
            font-size: 0.95rem;
            margin-bottom: 2rem;
        }
        .auth-input {
            width: 100%;
            padding: 0.85rem 1rem;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: #fff;
            font-family: 'Inter', sans-serif;
            font-size: 0.95rem;
            margin-bottom: 1rem;
            transition: all 0.2s;
        }
        .auth-input:focus {
            outline: none;
            border-color: var(--accent-5);
            box-shadow: 0 0 0 3px rgba(0, 201, 255, 0.2);
        }
        .auth-btn {
            width: 100%;
            padding: 0.85rem;
            background: var(--gradient-success);
            color: #000;
            border: none;
            border-radius: 100px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            margin-top: 1rem;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .auth-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0, 201, 255, 0.3);
        }
        .auth-link {
            display: inline-block;
            margin-top: 1.5rem;
            color: var(--text-muted);
            font-size: 0.85rem;
            text-decoration: none;
        }
        .auth-link:hover {
            color: #fff;
        }
        .error-msg {
            color: #ef4444;
            font-size: 0.85rem;
            margin-bottom: 1rem;
            display: none;
        }
    </style>
</head>
<body class="landing-body">
    <div class="mesh-bg">
        <div class="mesh-blob blob-1"></div>
        <div class="mesh-blob blob-2"></div>
        <div class="mesh-blob blob-3"></div>
    </div>

    <nav class="landing-nav">
        <a href="/" class="logo" style="text-decoration: none;">
            <span class="logo-text">Nexus AI</span>
        </a>
    </nav>

    <div class="auth-container">
        <div class="auth-card">
            <h2 class="auth-title">Create Account</h2>
            <p class="auth-subtitle">Join today to start researching.</p>
            
            <div id="errorMsg" class="error-msg"></div>

            <form id="regForm">
                <input type="text" id="username" class="auth-input" placeholder="Username" required>
                <input type="password" id="password" class="auth-input" placeholder="Password" required>
                <button type="submit" class="auth-btn">Sign Up</button>
            </form>
            
            <a href="/login" class="auth-link">Already have an account? Log In</a>
        </div>
    </div>

    <script>
        // STEP 1: Wake server silently on page load
        window.addEventListener('load', () => {
            fetch('/ping').catch(() => {});
        });

        document.getElementById("regForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            const btn = e.target.querySelector("button");
            const err = document.getElementById("errorMsg");
            
            err.style.display = "none";
            btn.textContent = "Creating...";
            btn.disabled = true;

            // STEP 4 & 5: Show timeout feedback if server is waking up
            let statusTimeout = setTimeout(() => {
                if (btn.disabled) {
                    btn.textContent = "Starting server... Please wait";
                }
            }, 5000);

            try {
                const res = await fetch("/register", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        username: document.getElementById("username").value,
                        password: document.getElementById("password").value
                    })
                });
                
                const data = await res.json();
                clearTimeout(statusTimeout);
                
                if (res.ok) {
                    btn.textContent = "Success! Redirecting...";
                    window.location.href = "/app";
                } else {
                    err.textContent = data.message || "Sign up failed";
                    err.style.display = "block";
                    btn.textContent = "Sign Up";
                    btn.disabled = false;
                }
            } catch (error) {
                clearTimeout(statusTimeout);
                err.textContent = "Network error. Server might be offline.";
                err.style.display = "block";
                btn.textContent = "Sign Up";
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
